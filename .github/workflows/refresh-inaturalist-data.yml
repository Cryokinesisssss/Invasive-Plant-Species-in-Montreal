name: Refresh iNaturalist data

concurrency:
  group: refresh-inaturalist-data
  cancel-in-progress: false

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data pipeline dependencies
        run: python -m pip install pandas shapely

      - name: Fetch current iNaturalist observations and photo licenses
        run: python scripts/update_observations.py

      - name: Rebuild and validate map data
        run: python scripts/run_data_pipeline.py

      - name: Commit refreshed map data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/obs_H_M_L.csv data/photo_licenses.json data/places.geojson
          if git diff --cached --quiet; then
            echo "Map data is already up to date."
          else
            git commit -m "Refresh iNaturalist map data"
            git push
          fi
